<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周报健康检查 · Regent RV</title>
<style>
  :root{
    --ink:#0f172a;--text:#334155;--muted:#64748b;--faint:#94a3b8;--grid:#e2e8f0;--panel:#f8fafc;--bg:#f4f6fa;
    --indigo:#4f46e5;--indigo-l:#eef2ff;--emerald:#059669;--emerald-l:#ecfdf5;--amber:#d97706;--amber-l:#fffbeb;
    --rose:#e11d48;--rose-l:#fff1f2;--radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Inter","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
  h1{margin:0;font-size:24px;color:var(--ink);letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  button,.btn{font:inherit;border:1px solid var(--grid);background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  button:hover,.btn:hover{border-color:#cbd5e1;background:var(--panel)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .btn-primary:hover{background:#4338ca;border-color:#4338ca}
  .btn-mail{background:var(--rose);border-color:var(--rose);color:#fff}
  .btn-mail:hover{background:#be123c;border-color:#be123c}
  .card{background:#fff;border:1px solid var(--grid);border-radius:var(--radius)}

  /* hero */
  .hero{display:flex;align-items:center;gap:20px;padding:22px 24px;margin-bottom:16px}
  .hero .icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:700;flex:none}
  .hero.ok .icon{background:var(--emerald-l);color:var(--emerald)}
  .hero.fail .icon{background:var(--rose-l);color:var(--rose)}
  .hero.checking .icon{background:var(--indigo-l);color:var(--indigo)}
  .hero h2{margin:0;font-size:22px;color:var(--ink)}
  .hero p{margin:2px 0 0;color:var(--muted)}
  .hero .grow{flex:1}

  /* pipeline */
  .pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-bottom:22px;overflow:hidden}
  .stage{padding:14px 16px;border-right:1px solid var(--grid);position:relative}
  .stage:last-child{border-right:none}
  .stage .lab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stage .val{font-size:20px;font-weight:700;color:var(--ink);margin-top:2px;display:flex;align-items:center;gap:8px}
  .stage .note{font-size:12px;color:var(--faint)}
  .stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grid)}
  .stage.ok::after{background:var(--emerald)} .stage.warn::after{background:var(--amber)}
  .stage.fail::after{background:var(--rose)} .stage.checking::after{background:var(--indigo);animation:pulse 1.2s infinite}

  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--faint)}
  .dot.ok{background:var(--emerald)} .dot.warn{background:var(--amber)} .dot.fail{background:var(--rose)}
  .dot.info{background:var(--faint)} .dot.checking{background:var(--indigo);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.35}}

  .section-title{font-size:13px;font-weight:700;color:var(--ink);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
  .section-title .count{background:var(--rose);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}

  /* problem cards */
  .issues{display:grid;gap:10px}
  .issue{padding:16px 18px;border-left:4px solid var(--rose);display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:start}
  .issue.warn{border-left-color:var(--amber)}
  .issue .t{font-weight:700;color:var(--ink);font-size:15px;display:flex;align-items:center;gap:8px}
  .issue .s{color:var(--text)}
  .issue .fix{grid-column:1/2;background:var(--panel);border-radius:8px;padding:9px 12px;color:var(--ink)}
  .issue .fix b{color:var(--indigo)}
  .issue .acts{grid-column:2/3;grid-row:1/4;display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .issue .when{font-size:12px;color:var(--faint)}

  /* table */
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--grid);background:var(--panel)}
  td{padding:11px 16px;border-bottom:1px solid var(--grid);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr.grp td{background:#fbfcfe;font-size:11px;font-weight:700;color:var(--indigo);text-transform:uppercase;letter-spacing:.05em;padding:7px 16px}
  td.name{font-weight:600;color:var(--ink);white-space:nowrap}
  td.name .dot{margin-right:9px;vertical-align:1px}
  td.upd{white-space:nowrap;color:var(--text)}
  td.upd small{display:block;color:var(--faint);font-size:11px}
  .stat{font-weight:600}
  .stat.ok{color:var(--emerald)} .stat.warn{color:var(--amber)} .stat.fail{color:var(--rose)} .stat.info{color:var(--muted)}
  details summary{cursor:pointer;color:var(--faint);font-size:12px;list-style:none}
  details summary::-webkit-details-marker{display:none}
  pre.detail{white-space:pre-wrap;font:12px/1.5 Consolas,monospace;color:var(--muted);margin:6px 0 0;background:var(--panel);padding:8px 10px;border-radius:6px}

  /* generate */
  .gen{padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
  .gen h3{margin:0;font-size:17px;color:var(--ink)}
  .gen p{margin:3px 0 0;color:var(--muted)}
  .gen .ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .gen label{display:flex;gap:6px;align-items:center;color:var(--text);font-size:13px}
  .gen input[type=date]{font:inherit;border:1px solid var(--grid);border-radius:8px;padding:5px 8px}
  .big{font-size:16px;padding:11px 26px}
  .force{background:none;border:none;color:var(--faint);font-weight:500;text-decoration:underline;padding:0}
  .force:hover{background:none;color:var(--rose)}
  .console{grid-column:1/3;background:#0b1020;color:#cbd5e1;border-radius:10px;font:12px/1.55 Consolas,monospace;height:320px;overflow:auto;padding:12px 14px;white-space:pre-wrap;display:none}
  .console .e{color:#fda4af} .console .w{color:#fcd34d} .console .g{color:#6ee7b7}
  .runbar{grid-column:1/3;display:none;align-items:center;gap:12px;font-weight:600}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .empty{padding:18px;color:var(--muted)}
  @media (max-width:820px){.pipe{grid-template-columns:repeat(2,1fr)}.issue{grid-template-columns:1fr}.issue .acts{grid-column:1;grid-row:auto;flex-direction:row;flex-wrap:wrap}.gen{grid-template-columns:1fr}.console,.runbar{grid-column:1}td.upd,th.upd{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>周报健康检查</h1>
      <div class="sub">Regent RV Weekly Report · <span id="checkedAt">正在检查…</span></div>
    </div>
    <button id="recheck" onclick="recheck()">↻ 重新检查</button>
  </header>

  <div id="hero" class="card hero checking">
    <div class="icon">…</div>
    <div class="grow"><h2>正在检查各个环节</h2><p>SAP、邮件、网页系统需要 1–2 分钟</p></div>
  </div>

  <div id="pipe" class="card pipe"></div>

  <div id="issuesWrap" style="display:none">
    <div class="section-title">需要处理 <span class="count" id="issueCount">0</span></div>
    <div class="issues" id="issues"></div>
  </div>

  <div class="section-title">生成报告</div>
  <div class="card gen">
    <div>
      <h3 id="genTitle">等待检查完成</h3>
      <p id="genSub">所有环节没问题后就可以生成。</p>
    </div>
    <div class="ctl">
      <label>报告日期 <input type="date" id="asOf"></label>
      <label><input type="checkbox" id="noEmail"> 只生成，不发邮件</label>
      <button class="btn-primary big" id="genBtn" onclick="generate(false)" disabled>生成报告</button>
    </div>
    <div class="runbar" id="runbar"><span class="dot checking" id="runDot"></span><span id="runText"></span><span style="flex:1"></span><button id="pdfBtn" onclick="downloadPdf()" style="display:none">⇩ 下载 PDF</button></div>
    <div class="console" id="console"></div>
  </div>

  <div class="section-title">所有环节</div>
  <div class="card" style="overflow:hidden">
    <table>
      <thead><tr><th style="width:30%">环节</th><th>状态</th><th class="upd" style="width:200px">最后刷新</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="empty">正在检查…</td></tr></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const GROUPS = ["SAP","邮件","数据源","运行环境","上次运行","其它"];
const STATUS_TEXT = {ok:"正常", warn:"注意", fail:"有问题", info:"—"};
let status = null, runSince = 0, runPoll = null, statusTimer = null, wasRunning = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function rel(isoStr){
  if(!isoStr) return "";
  const d = new Date(isoStr), now = new Date();
  if(isoStr.length <= 10){                       // 只有日期
    const days = Math.round((new Date(now.toDateString()) - new Date(isoStr+"T00:00")) / 864e5);
    return days <= 0 ? "今天" : days === 1 ? "昨天" : `${days} 天前`;
  }
  const s = (now - d) / 1000;
  if(s < 90) return "刚刚";
  if(s < 3600) return `${Math.round(s/60)} 分钟前`;
  if(s < 86400) return `${Math.round(s/3600)} 小时前`;
  return `${Math.round(s/86400)} 天前`;
}
function abs(isoStr){
  if(!isoStr) return "";
  const d = new Date(isoStr.length <= 10 ? isoStr+"T00:00" : isoStr);
  const opt = isoStr.length <= 10 ? {weekday:"short",day:"numeric",month:"short"} :
              {weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"};
  return d.toLocaleString("zh-CN", opt);
}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>toast("已复制")); return; }
  const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制"); }catch(e){ prompt("复制下面的内容：", text); }
  ta.remove();
}

function actionHtml(a, i, rid){
  if(a.type === "mailto"){
    const href = `mailto:${encodeURIComponent(a.to)}?subject=${encodeURIComponent(a.subject)}&body=${encodeURIComponent(a.body)}`;
    return `<a class="btn btn-mail" href="${href}">✉ ${esc(a.label)}</a>
            <button onclick="copyAction('${rid}',${i})">复制提醒内容</button>`;
  }
  if(a.type === "copy") return `<button onclick="copyAction('${rid}',${i})">⧉ ${esc(a.label)}</button>`;
  if(a.type === "download") return `<button onclick="downloadPdf()">⇩ ${esc(a.label)}</button>`;
  return "";
}
function copyAction(rid, i){
  const r = status.results.find(x => x.id === rid); const a = r.actions[i];
  copyText(a.type === "mailto" ? `To: ${a.to}\nSubject: ${a.subject}\n\n${a.body}` : a.text);
}

function worst(list){
  if(list.some(r=>r.status==="fail")) return "fail";
  if(list.some(r=>r.status==="warn")) return "warn";
  if(list.some(r=>r.status==="ok")) return "ok";
  return "info";
}

function render(){
  const s = status, res = s.results;
  const online = agentOnline(), inWin = inWindowNow();
  if(!online) s.checking = false;                 // 电脑关了，没有正在进行的检查
  let when = s.checking ? "正在检查…" : (s.finished ? `检查于 ${abs(s.finished)}（${rel(s.finished)}）` : "还没检查过");
  if(online && !s.checking && s.next_auto) when += ` · 下次自动 ${new Date(s.next_auto).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}`;
  when += online ? ` · 监控电脑在线（${agent.host||""}）` : " · 监控电脑未开启";
  $("checkedAt").textContent = when;
  $("recheck").disabled = s.checking || !online;

  // hero
  const hero = $("hero");
  const blockers = res.filter(r=>r.status==="fail" && r.blocking);
  const peopleFail = blockers.filter(r=>r.id.startsWith("person_") || r.id.startsWith("kind_"));
  const lastSeen = agent && agent.last_seen ? `${abs(agent.last_seen)}` : "";
  if(!online && inWin){
    hero.className="card hero fail";
    hero.innerHTML=`<div class="icon">!</div><div class="grow"><h2>监控电脑没有连上</h2><p>现在是检查时间（${esc(windowText())}），但那台电脑上的监控程序没在运行${lastSeen?`（最后在线 ${esc(lastSeen)}）`:""}。
      请确认那台电脑开着、已登录，并运行 start_agent.bat；还不行请联系 Leo。下面显示的是上一次的结果。</p></div>`;
  } else if(!online){
    hero.className="card hero checking";
    hero.innerHTML=`<div class="icon">◷</div><div class="grow"><h2>现在不是检查时间</h2><p>每${esc(windowText())}自动检查，每 10 分钟刷新一次。${s.finished?`下面是 ${esc(abs(s.finished))} 的结果。`:""}</p></div>`;
  } else if(!s.checking && !res.length){
    hero.className="card hero checking";
    hero.innerHTML=`<div class="icon">◷</div><div class="grow"><h2>还没有检查结果</h2><p>可以手动检查一次。</p></div>
      <button class="btn-primary big" onclick="recheck()">立即检查</button>`;
  } else if(s.checking && !res.length){
    hero.className="card hero checking";
    hero.innerHTML=`<div class="icon">…</div><div class="grow"><h2>正在检查各个环节</h2><p>SAP、邮件、网页系统需要 1–2 分钟</p></div>`;
  } else if(blockers.length){
    hero.className="card hero fail";
    const who = peopleFail.length && peopleFail.length === blockers.length ? "全部是邮件没到，发提醒就行" : "按下面的建议处理";
    hero.innerHTML=`<div class="icon">!</div><div class="grow"><h2>${blockers.length} 个环节有问题，暂时不能生成完整报告</h2><p>${who}${s.checking?" · 还在检查剩下的环节…":""}</p></div>`;
  } else if(s.checking){
    hero.className="card hero checking";
    hero.innerHTML=`<div class="icon">…</div><div class="grow"><h2>目前没发现问题，还在检查…</h2><p>还剩：${esc(s.pending.join("、"))}</p></div>`;
  } else {
    hero.className="card hero ok";
    hero.innerHTML=`<div class="icon">✓</div><div class="grow"><h2>一切就绪，可以生成报告</h2><p>所有数据源都正常，三个人的邮件都已收到</p></div>
      <button class="btn-primary big" onclick="document.getElementById('genBtn').scrollIntoView({behavior:'smooth',block:'center'})">去生成 ↓</button>`;
  }

  // pipeline
  const stageDefs = [
    {lab:"SAP", ids:r=>r.group==="SAP", pend:["SAP HANA 连接"]},
    {lab:"三人邮件", ids:r=>r.group==="邮件", pend:["Outlook 邮件"]},
    {lab:"数据源", ids:r=>r.group==="数据源", pend:["展会数据 (Firebase)","排产 / 订单数据 (Firebase)","网页系统","发票 / 质保脚本"]},
    {lab:"运行环境", ids:r=>r.group==="运行环境", pend:["OpenAI 读图","Python 依赖包"]},
    {lab:"上次运行", ids:r=>r.group==="上次运行", pend:["Task Scheduler","上次生成的报告"]},
  ];
  $("pipe").innerHTML = stageDefs.map(st=>{
    const list = res.filter(st.ids);
    const pending = st.pend.some(p=>s.pending.includes(p));
    let cls = pending && !list.some(r=>r.status==="fail") ? "checking" : worst(list);
    if(st.lab === "上次运行" && cls === "fail") cls = "warn";
    const bad = list.filter(r=>r.status==="fail").length, warn = list.filter(r=>r.status==="warn").length;
    let val = cls==="checking" ? "检查中" : bad ? `${bad} 个问题` : warn ? `${warn} 个提醒` : list.length ? "正常" : "—";
    let note = "";
    if(st.lab==="三人邮件"){
      const ppl = list.filter(r=>r.id.startsWith("person_"));
      if(ppl.length) note = ppl.map(r=>(r.status==="ok"?"✓ ":"✗ ")+r.title.replace(" 的邮件","")).join("  ");
    } else if(st.lab==="SAP"){
      const f = list.find(r=>r.id==="sap_fresh"); if(f) note = f.summary;
    } else note = `${list.length} 项`;
    return `<div class="stage ${cls}"><div class="lab">${st.lab}</div><div class="val"><span class="dot ${cls}"></span>${val}</div><div class="note">${esc(note)}</div></div>`;
  }).join("");

  // issues
  const issues = res.filter(r=>r.status==="fail" || (r.status==="warn" && r.suggestion))
                    .sort((a,b)=>(a.status==="fail"?0:1)-(b.status==="fail"?0:1) || a.order-b.order);
  $("issuesWrap").style.display = issues.length ? "" : "none";
  $("issueCount").textContent = issues.length;
  $("issues").innerHTML = issues.map(r=>`
    <div class="card issue ${r.status}">
      <div class="t"><span class="dot ${r.status}"></span>${esc(r.title)}</div>
      <div class="s">${esc(r.summary)} ${r.updated?`<span class="when">· ${esc(r.updated_label||"更新")} ${abs(r.updated)}（${rel(r.updated)}）</span>`:""}</div>
      ${r.suggestion?`<div class="fix"><b>建议：</b>${esc(r.suggestion)}</div>`:""}
      <div class="acts">${r.actions.map((a,i)=>actionHtml(a,i,r.id)).join("")}</div>
    </div>`).join("");

  // table
  let html = "";
  for(const g of GROUPS){
    const list = res.filter(r=>r.group===g);
    if(!list.length) continue;
    html += `<tr class="grp"><td colspan="3">${g}</td></tr>`;
    html += list.map(r=>`<tr>
      <td class="name"><span class="dot ${r.status}"></span>${esc(r.title)}</td>
      <td><span class="stat ${r.status}">${STATUS_TEXT[r.status]}</span> · ${esc(r.summary)}
        ${r.detail?`<details><summary>详情 ▸</summary><pre class="detail">${esc(r.detail)}</pre></details>`:""}</td>
      <td class="upd">${r.updated?`${esc(rel(r.updated))}<small>${esc(r.updated_label||"")} · ${esc(abs(r.updated))}</small>`:'<span style="color:var(--faint)">—</span>'}</td>
    </tr>`).join("");
  }
  if(s.pending.length) html += `<tr><td colspan="3" class="empty"><span class="dot checking"></span> 正在检查：${esc(s.pending.join("、"))}</td></tr>`;
  $("rows").innerHTML = html || `<tr><td colspan="3" class="empty">${s.checking ? "正在检查…" : "还没检查"}</td></tr>`;

  renderGen();
}

function renderGen(){
  const s = status; if(!s) return;
  const running = wasRunning;
  const btn = $("genBtn");
  const blockers = s.results.filter(r=>r.status==="fail" && r.blocking).length;
  btn.disabled = running || s.checking || !s.ready || !agentOnline() || !!pendingCmd;
  if(!agentOnline() && !running){ $("genTitle").textContent="监控电脑未开启"; $("genSub").textContent=`只能在${windowText()}、监控电脑开着时生成。`; return; }
  if(running){ $("genTitle").textContent="报告生成中…"; $("genSub").textContent="大约需要 5–10 分钟，可以关掉网页，稍后再回来看。"; }
  else if(!s.checking && !s.results.length){ $("genTitle").textContent="还没检查"; $("genSub").textContent="先点“立即检查”，全部正常后才能生成。"; }
  else if(s.checking){ $("genTitle").textContent="等待检查完成"; $("genSub").textContent="所有环节没问题后就可以生成。"; }
  else if(s.ready){ $("genTitle").textContent="可以生成报告了"; $("genSub").textContent=$("noEmail").checked?"生成 PDF 后可以在这里下载。":"生成后会自动发邮件给 Leo（抄送 Yan）。"; }
  else { $("genTitle").textContent=`还有 ${blockers} 个问题`; $("genSub").innerHTML=`先处理上面的红色问题。实在等不了可以 <button class="force" onclick="generate(true)">强制生成（会缺页）</button>`; }
}

// ===================== Firebase 数据层 =====================
const CFG = window.MONITOR_CONFIG;
let KEY = (location.hash.match(/k=([\w-]+)/)||[])[1] || localStorage.getItem("monitorKey") || "";
let agent = null, run = null, pendingCmd = null, refreshTimer = null;

const node = p => `${CFG.DATABASE_URL.replace(/\/$/,"")}/weeklyMonitor/${KEY}/${p}.json`;
async function fbGet(p){ const r = await fetch(node(p), {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function fbPut(p, v){ const r = await fetch(node(p), {method:"PUT", body:JSON.stringify(v)}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

function norm(s){
  s = s || {};
  s.results = (s.results || []).map(r => ({summary:"", detail:"", suggestion:"", updated_label:"", ...r, actions:r.actions || []}));
  s.pending = s.pending || [];
  s.checking = !!s.checking; s.ready = !!s.ready;
  return s;
}
function hmOf(str){ const [h,m] = str.split(":").map(Number); return h*60+m; }
function windowText(){
  const names = "日一二三四五六";
  return CFG.WINDOW_DAYS.map(d=>"周"+names[d]).join("、") + ` ${CFG.WINDOW[0]}–${CFG.WINDOW[1]}`;
}
function inWindowNow(){
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:CFG.TIMEZONE,weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false})
                  .formatToParts(new Date()).map(p=>[p.type,p.value]));
  const day = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(parts.weekday);
  const mins = (Number(parts.hour)%24)*60 + Number(parts.minute);
  return CFG.WINDOW_DAYS.includes(day) && mins >= hmOf(CFG.WINDOW[0]) && mins < hmOf(CFG.WINDOW[1]);
}
function agentOnline(){ return !!(agent && !agent.stopped && Date.now() - (agent.last_seen_ms||0) < 75000); }

async function refresh(){
  clearTimeout(refreshTimer);
  if(!KEY){ askKey(); return; }
  try{
    const [a, s, r, ack] = await Promise.all([fbGet("agent"), fbGet("status"), fbGet("run"), fbGet("command_ack")]);
    agent = a; status = norm(s); run = r;
    if(pendingCmd && ack && ack.id === pendingCmd.id){ toast(ack.message || (ack.ok ? "已执行" : "没有执行")); pendingCmd = null; }
    if(pendingCmd && Date.now() - pendingCmd.at > 40000){ toast("监控电脑没有响应，请确认它开着"); pendingCmd = null; }
    render(); renderRun();
  }catch(e){
    $("checkedAt").textContent = String(e).includes("401") || String(e).includes("403")
      ? "没有权限读取数据（访问码不对？）" : "连不上 Firebase：" + e.message;
  }
  const active = (status && status.checking) || (run && run.running) || pendingCmd;
  refreshTimer = setTimeout(refresh, active ? 2500 : 15000);
}

function askKey(){
  const k = prompt("请输入访问码（Leo 提供的链接里 #k= 后面那串）：");
  if(k){ KEY = k.trim(); localStorage.setItem("monitorKey", KEY); refresh(); }
}

async function sendCmd(cmd){
  if(!agentOnline()){ toast("监控电脑不在线，命令发不出去"); return false; }
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  try{ await fbPut("command", {...cmd, id, at_ms: Date.now()}); }
  catch(e){ toast("发送失败：" + e.message); return false; }
  pendingCmd = {id, at: Date.now()};
  toast("已发送到监控电脑…");
  setTimeout(refresh, 1500);
  return true;
}

function recheck(){ sendCmd({type:"check"}); }
function generate(force){
  if(force && !confirm("还有问题没解决，强制生成的报告会缺页。确定吗？")) return;
  sendCmd({type:"generate", force, no_email:$("noEmail").checked, as_of:$("asOf").value || null});
}

async function downloadPdf(){
  toast("正在下载…");
  try{
    const f = await fbGet("files/pdf");
    if(!f || !f.b64){ const m = await fbGet("files/pdf_meta"); toast(m && m.reason ? m.reason : "还没有可下载的 PDF"); return; }
    const bytes = Uint8Array.from(atob(f.b64), c => c.charCodeAt(0));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
    a.download = f.name || "weekly_report.pdf"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  }catch(e){ toast("下载失败：" + e.message); }
}

function lineClass(l){
  if(/fail|error|traceback|not found|skipped|warning|missing|could not/i.test(l)) return /warning|skipped|missing/i.test(l) ? "w" : "e";
  if(/created|sent|\bok\b|validated|PDF created/i.test(l)) return "g";
  return "";
}

let lastLogKey = "";
function renderRun(){
  const j = run || {};
  const any = j.running || j.started;
  $("console").style.display = any ? "block" : "none";
  $("runbar").style.display = any ? "flex" : "none";
  wasRunning = !!j.running;
  const lines = j.lines || [];
  const key = (j.started||"") + "|" + (j.total||0);
  if(key !== lastLogKey){
    lastLogKey = key;
    const c = $("console"), atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40 || !c.innerHTML;
    c.innerHTML = lines.map(l=>`<div class="${lineClass(l)}">${esc(l)}</div>`).join("");
    if(atBottom) c.scrollTop = c.scrollHeight;
  }
  if(j.running){
    $("runDot").className = "dot checking"; $("runText").textContent = `生成中 · 开始于 ${abs(j.started)}`; $("pdfBtn").style.display = "none";
  } else if(j.started){
    const ok = j.returncode === 0;
    $("runDot").className = "dot " + (ok ? "ok" : "fail");
    $("runText").textContent = ok ? `上次生成完成 · ${abs(j.finished)}` : `上次运行出错（代码 ${j.returncode}）· 请把日志发给 Leo`;
    $("pdfBtn").style.display = ok ? "" : "none";
  }
  renderGen();
}

$("asOf").value = new Date(Date.now() - new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
$("noEmail").addEventListener("change", renderGen);
if(location.hash.includes("k=")){ localStorage.setItem("monitorKey", KEY); history.replaceState(null, "", location.pathname); }
refresh();
</script>
