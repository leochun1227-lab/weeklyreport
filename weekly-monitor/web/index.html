<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Report · Regent RV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{
    --ink:#0f172a;--text:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e2e8f0;--panel:#f8fafc;--bg:#f4f6fa;
    --indigo:#4f46e5;--indigo-l:#eef2ff;--green:#059669;--green-l:#ecfdf5;--green-m:#a7f3d0;
    --amber:#d97706;--amber-l:#fffbeb;--red:#e11d48;--red-l:#fff1f2;--red-m:#fecdd3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Inter",system-ui,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:30px 24px 60px}
  button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 14px;cursor:pointer;
    font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  button:hover,.btn:hover{border-color:#cbd5e1;background:var(--panel)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .ti{font-size:17px}

  /* top bar */
  .top{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
  .top h1{margin:0;font-size:24px;color:var(--ink);flex:1;letter-spacing:-.01em}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .seg button{border:none;border-radius:0;padding:7px 18px;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#fff}
  input[type=month],input[type=date]{font:inherit;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:#fff;color:var(--ink)}

  /* flow: sources -> generate */
  .flow{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) 84px minmax(0,0.95fr);align-items:center}
  .srcs{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
  .src{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;transition:border-color .2s,background .2s}
  .src .row{display:flex;align-items:center;gap:14px}
  .src .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--panel);color:var(--faint)}
  .src .ic .ti{font-size:23px}
  .src .nm{font-size:16px;font-weight:600;color:var(--ink);flex:1}
  .pill{font-size:12.5px;font-weight:600;padding:3px 11px;border-radius:99px;background:var(--panel);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .src.ok .ic{background:var(--green-l);color:var(--green)} .src.ok .pill{background:var(--green-l);color:var(--green)}
  .src.warn .ic{background:var(--amber-l);color:var(--amber)} .src.warn .pill{background:var(--amber-l);color:var(--amber)}
  .src.fail{border-color:var(--red-m);background:var(--red-l)}
  .src.fail .ic{background:#fff;color:var(--red)} .src.fail .pill{background:#fff;color:var(--red)}
  .src.wait .ic{background:var(--indigo-l);color:var(--indigo)} .src.wait .pill{background:var(--indigo-l);color:var(--indigo)}
  .src .iss{margin:12px 0 0 58px;color:var(--red);font-weight:600}
  .src.warn .iss{color:var(--amber)}
  .src .acts{display:flex;gap:8px;margin:10px 0 0 58px;flex-wrap:wrap}
  .src .acts .btn,.src .acts button{padding:6px 12px;font-size:13px}
  .src .acts .remind{background:var(--red);border-color:var(--red);color:#fff}
  .src .acts .remind:hover{background:#be123c}
  .src .pick{display:none;gap:8px;margin:10px 0 0 58px;flex-wrap:wrap}
  .src .pick.open{display:flex}
  .src .pick select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:6px;max-width:100%;flex:1;min-width:200px}
  svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0;pointer-events:none}
  svg.lines path{transition:stroke .3s}

  .gen{position:relative;z-index:1;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 26px;text-align:center}
  .gen .big{width:84px;height:84px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;background:var(--panel);color:var(--faint)}
  .gen .big .ti{font-size:42px}
  .gen h2{margin:0 0 6px;font-size:21px;color:var(--ink)}
  .gen .msg{margin:0 0 20px;font-weight:600;min-height:21px}
  .gen .date{display:flex;justify-content:center;margin:0 0 14px}
  .gen .go{width:100%;padding:13px;font-size:16px;border-radius:12px;background:var(--indigo);border-color:var(--indigo);color:#fff}
  .gen .go:hover{background:#4338ca}
  .gen .go:disabled{background:#c7d2fe;border-color:#c7d2fe;opacity:1;color:#fff}
  .gen .sec{width:100%;padding:11px;border-radius:12px;margin-top:10px}
  .gen .force{width:100%;margin-top:10px;border:none;background:none;color:var(--faint);font-weight:500}
  .gen .force:hover{color:var(--red);background:none}
  .gen.ok .big{background:var(--green-l);color:var(--green)} .gen.ok .msg{color:var(--green)}
  .gen.fail .big{background:var(--red-l);color:var(--red)} .gen.fail .msg{color:var(--red)}
  .gen.busy .big{background:var(--indigo-l);color:var(--indigo)} .gen.busy .msg{color:var(--indigo)}
  .gen.idle .msg{color:var(--muted)}
  .bar{height:8px;border-radius:99px;background:var(--panel);overflow:hidden;margin:0 0 6px}
  .bar i{display:block;height:100%;background:var(--indigo);border-radius:99px;transition:width .6s}
  .spin{animation:spin 1.1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

  /* details for Leo (collapsed) */
  details.more{margin-top:34px}
  details.more summary{cursor:pointer;color:var(--faint);font-size:12px;list-style:none;text-align:center}
  details.more summary::-webkit-details-marker{display:none}
  .tbl{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.n{font-weight:600;color:var(--ink);white-space:nowrap}
  .s-ok{color:var(--green)} .s-warn{color:var(--amber)} .s-fail{color:var(--red)} .s-info{color:var(--muted)}
  .console{background:#0b1020;color:#cbd5e1;border-radius:10px;font:12px/1.55 Consolas,monospace;max-height:280px;overflow:auto;padding:12px 14px;white-space:pre-wrap;margin-top:12px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:820px){.flow{grid-template-columns:1fr;gap:18px}.flow .gap{display:none}svg.lines{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Regent RV Report</h1>
    <div class="seg"><button id="segW" onclick="switchMode('weekly')">Weekly</button><button id="segM" onclick="switchMode('monthly')">Monthly</button></div>
    <input type="month" id="monthPick" style="display:none" onchange="switchMode('monthly')">
    <button id="recheck" onclick="recheck()"><i class="ti ti-refresh"></i>Re-check</button>
  </div>

  <div class="flow" id="flow">
    <svg class="lines" id="lines"></svg>
    <div class="srcs" id="srcs"></div>
    <div class="gap"></div>
    <div class="gen idle" id="gen"></div>
  </div>

  <details class="more" id="more">
    <summary>Details</summary>
    <div class="tbl"><table><tbody id="rows"></tbody></table></div>
    <div class="console" id="console"></div>
  </details>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const CFG = window.MONITOR_CONFIG;
let status = null, agent = null, run = null, pendingCmd = null, refreshTimer = null;
let autoChecked = false;                 // the page checks once by itself when it is opened
let pdfMeta = null, justGenerated = false;
const openPick = {};                     // which "Pick email" lists are open

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }
function abs(iso){ if(!iso) return ""; return new Date(iso).toLocaleString("en-AU",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); }
function agentOnline(){ return !!(agent && !agent.stopped && Date.now() - (agent.last_seen_ms||0) < 75000); }

// ---------- Firebase ----------
const node = p => `${CFG.DATABASE_URL.replace(/\/$/,"")}/${CFG.DATA_PATH}/${p}.json`;
async function fbGet(p){ const r = await fetch(node(p), {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function fbPut(p, v){ const r = await fetch(node(p), {method:"PUT", body:JSON.stringify(v)}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
function norm(s){
  s = s || {};
  s.results = (s.results || []).map(r => ({summary:"", detail:"", suggestion:"", ...r, actions:r.actions || []}));
  s.pending = s.pending || []; s.checking = !!s.checking; s.ready = !!s.ready;
  return s;
}

// ---------- commands ----------
async function sendCmd(cmd){
  if(!agentOnline()){ toast("The report PC is offline"); return; }
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  try{ await fbPut("command", {...cmd, id, at_ms: Date.now()}); }
  catch(e){ toast("Couldn't send: " + e.message); return; }
  pendingCmd = {id, at: Date.now()};
  toast("Sent to the report PC…");
  setTimeout(refresh, 1500);
}
function recheck(){ sendCmd({type:"check"}); }
function generate(force){
  if(force && !confirm("Some data is missing — the PDF will be missing pages. Continue?")) return;
  justGenerated = true;
  sendCmd({type:"generate", force, as_of:($("asOf") && $("asOf").value) || null});
}
function switchMode(mode){
  const month = $("monthPick").value || (status && status.default_month) || null;
  if(status && status.mode === mode && (mode === "weekly" || status.month === month)) return;
  sendCmd({type:"mode", mode, month});
}
function togglePick(kind){ openPick[kind] = !openPick[kind]; render(); }
function pickEmail(kind){
  const sel = $("pick-"+kind); if(!sel || !sel.value){ toast("Choose an email first"); return; }
  openPick[kind] = false;
  sendCmd({type:"pick_email", kind, entry_id: sel.value, label: sel.options[sel.selectedIndex].text});
}
function chooseUpload(kind){ $("up-"+kind).click(); }
async function uploadFiles(kind){
  const inp = $("up-"+kind);
  const files = inp && inp.files ? Array.from(inp.files) : [];
  if(!files.length) return;
  if(files.reduce((n,f)=>n+f.size,0) > 9e6){ toast("Files are too large (max 9 MB in total)"); return; }
  if(!agentOnline()){ toast("The report PC is offline"); return; }
  toast("Uploading…");
  const read = f => new Promise((ok,bad)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=bad; r.readAsDataURL(f); });
  try{
    const payload = {at: Date.now(), files: []};
    for(const f of files) payload.files.push({name: f.name, type: f.type, b64: await read(f)});
    await fbPut(`uploads/${kind}`, payload);
  }catch(e){ toast("Upload failed: " + e.message); return; }
  sendCmd({type:"upload", kind});
}

// ---------- the four sources ----------
function shortIssue(r, monthly){
  const s = r.summary || "";
  if(/^No .*email/i.test(s)) return monthly ? "No month-end email yet" : "No email this week";
  if(/days old/i.test(s)) return "Only last week's email";
  if(/Selected email can't be read/i.test(s)) return "The picked email can't be read";
  if(/Email format problem/i.test(s)) return "The email can't be read";
  if(/^Uploaded/i.test(s)) return "The uploaded file can't be read";
  if(/Not marked as Final/i.test(s)) return "Not marked as Final";
  return s.split(" · ")[0];
}
function sources(){
  const s = status, res = s.results, monthly = s.mode === "monthly";
  const pend = name => s.checking && s.pending.includes(name);
  const out = [];
  // SAP
  const sap = res.filter(r => r.group === "SAP");
  const sapFail = sap.some(r => r.status === "fail" && r.blocking);
  out.push({key:"sap", name:"SAP", icon:"ti-database",
    st: pend("SAP HANA connection") && !sapFail ? "wait" : sapFail ? "fail" : sap.length ? "ok" : "idle",
    pill: sapFail ? "Down" : "Connected", issue: sapFail ? "Wait for Longtree IT to fix SAP" : ""});
  // one box per report email (Jake / Mark)
  const outlook = res.find(r => r.id === "mail");
  const kinds = res.filter(r => r.id.startsWith("kind_")).sort((a,b)=>a.order-b.order);
  const defs = kinds.length ? kinds : [{id:"kind_snowy", title:"Snowy River email from Jake"}, {id:"kind_leisure", title:"Leisure Lion email from Mark"}];
  for(const r of defs){
    const kind = r.id.replace("kind_","");
    const who = (String(r.title).match(/from (\S+)/) || [,""])[1];
    const brand = /snowy/i.test(r.title) ? "Snowy River" : /leisure/i.test(r.title) ? "Leisure Lion" : r.title;
    const box = {key:r.id, kind, name: who ? `${brand} · ${who}` : brand, icon:"ti-mail", acts:[]};
    const manual = /^Using (selected|uploaded)/.test(r.summary || "");
    if(outlook && outlook.status === "fail"){ Object.assign(box, {st:"fail", pill:"Action needed", issue:"Outlook can't be opened — contact Leo"}); }
    else if(pend("Outlook email") && r.status !== "fail"){ Object.assign(box, {st:"wait", pill:"Checking"}); }
    else if(!r.status){ Object.assign(box, {st:"idle", pill:"Not checked"}); }
    else if(r.status === "fail"){ Object.assign(box, {st:"fail", pill:"Action needed", issue: shortIssue(r, monthly), acts: r.actions}); }
    else if(r.status === "warn"){ Object.assign(box, {st:"warn", pill:"Check", issue: shortIssue(r, monthly), acts: r.actions}); }
    else { Object.assign(box, {st:"ok", pill: manual ? "Picked by hand" : "Received", acts: manual ? r.actions.filter(a=>a.type==="clear_override") : []}); }
    out.push(box);
  }
  // everything else
  const others = res.filter(r => r.group !== "SAP" && r.group !== "Email");
  const oFail = others.some(r => r.status === "fail");
  const oWarn = others.some(r => r.status === "warn");
  const oPend = s.checking && s.pending.some(p => p !== "SAP HANA connection" && p !== "Outlook email");
  out.push({key:"other", name:"Other data", icon:"ti-stack-2",
    st: oFail ? "fail" : oPend ? "wait" : oWarn ? "warn" : others.length ? "ok" : "idle",
    pill: oFail ? "Action needed" : oWarn ? "Check" : "Ready",
    issue: oFail ? "Contact Leo" : oWarn ? "Some pages may be missing — contact Leo" : ""});
  return out;
}
function actionsHtml(b){
  const h = [];
  for(const a of b.acts || []){
    if(a.type === "mailto"){
      const href = `mailto:${encodeURIComponent(a.to)}?subject=${encodeURIComponent(a.subject)}&body=${encodeURIComponent(a.body)}`;
      h.push(`<a class="btn remind" href="${href}"><i class="ti ti-send"></i>${esc(a.label.replace(/^Email (\S+) a reminder$/,"Remind $1"))}</a>`);
    } else if(a.type === "pick_email"){
      h.push(`<button onclick="togglePick('${b.kind}')"><i class="ti ti-mail-search"></i>Pick email</button>`);
    } else if(a.type === "upload"){
      h.push(`<button onclick="chooseUpload('${b.kind}')"><i class="ti ti-upload"></i>Upload</button>
              <input type="file" id="up-${b.kind}" accept="${esc(a.accept||"")}" multiple style="display:none" onchange="uploadFiles('${b.kind}')">`);
    } else if(a.type === "clear_override"){
      h.push(`<button onclick="sendCmd({type:'clear_override',kind:'${b.kind}'})"><i class="ti ti-arrow-back-up"></i>Undo pick</button>`);
    }
  }
  const pick = (b.acts||[]).find(a => a.type === "pick_email");
  const pickHtml = pick ? `<div class="pick ${openPick[b.kind]?"open":""}"><select id="pick-${b.kind}">${(pick.options||[]).map(o=>`<option value="${esc(o.id)}">${esc(o.label)}</option>`).join("")}</select>
      <button onclick="pickEmail('${b.kind}')">Use this email</button></div>` : "";
  return (h.length ? `<div class="acts">${h.join("")}</div>` : "") + pickHtml;
}
const PILL_ICON = {ok:"ti-check", fail:"ti-alert-circle", warn:"ti-alert-triangle", wait:"ti-loader-2 spin", idle:"ti-minus"};

// ---------- the generate card ----------
function weekStart(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
function runIsCurrent(j){ return !!(j && j.started) && new Date(j.started) >= weekStart(); }
function pdfFresh(){
  const m = pdfMeta;
  if(!m || !m.uploaded || !m.at || new Date(m.at) < weekStart()) return false;
  return !(run && run.started) || (!run.running && m.at >= run.started);
}
const STEPS = [/Invoice \(SAP\)/i, /Scrape|Snowy App|Production/i, /Show/i, /Order/i, /Dealer inventory/i,
               /Warranty|Aftersales/i, /Recall/i, /Sales Report|sales_email/i, /PDF created|Report saved/i];
function progress(lines){
  let done = 0; for(const re of STEPS) if((lines||[]).some(l => re.test(l))) done++;
  return Math.max(6, Math.round(done / STEPS.length * 100));
}
function renderGen(){
  const s = status, j = run || {}, online = agentOnline(), monthly = s.mode === "monthly";
  const blockers = s.results.filter(r => r.status === "fail" && r.blocking).length;
  const g = $("gen");
  const dateHtml = monthly ? "" : `<div class="date"><input type="date" id="asOf" value="${esc(($("asOf")&&$("asOf").value) || new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10))}"></div>`;
  const label = monthly ? `${s.month_label || "Monthly"} report` : "Weekly report";
  const btn = (dis) => `${dateHtml}<button class="go" onclick="generate(false)" ${dis?"disabled":""}><i class="ti ti-file-export"></i>Generate</button>`;
  let cls, icon, title, msg, body;
  if(j.running){
    cls="busy"; icon="ti-loader-2 spin"; title="Generating…"; msg=label;
    body=`<div class="bar"><i style="width:${progress(j.lines)}%"></i></div>`;
  } else if(runIsCurrent(j) && j.returncode === 0 && pdfFresh()){
    cls="ok"; icon="ti-file-download"; title="Report downloaded"; msg=abs(pdfMeta.at);
    body=`<button class="go" onclick="downloadPdf()"><i class="ti ti-download"></i>Download again</button>
          <button class="sec" onclick="generate(false)" ${(!online||s.checking||!s.ready||pendingCmd)?"disabled":""}><i class="ti ti-refresh"></i>Generate again</button>`;
  } else if(runIsCurrent(j) && j.returncode === 0){
    cls="busy"; icon="ti-loader-2 spin"; title="Finishing…"; msg="Downloading the PDF"; body=`<div class="bar"><i style="width:100%"></i></div>`;
  } else if(!online){
    cls="idle"; icon="ti-plug-connected-x"; title="Report PC offline"; msg="Turn it on, then Re-check"; body=btn(true);
  } else if(s.checking){
    cls="busy"; icon="ti-loader-2 spin"; title="Checking…"; msg=label; body=btn(true);
  } else if(blockers){
    cls="fail"; icon="ti-file-alert"; title="Generate report"; msg=`${blockers} ${blockers===1?"item needs":"items need"} attention`;
    body=btn(true) + `<button class="force" onclick="generate(true)">Generate anyway</button>`;
  } else if(s.ready){
    cls="ok"; icon="ti-file-check"; title="Generate report"; msg="Ready"; body=btn(!!pendingCmd);
  } else {
    cls="idle"; icon="ti-file"; title="Generate report"; msg="Re-check first"; body=btn(true);
  }
  if(runIsCurrent(j) && !j.running && j.returncode !== 0 && j.returncode != null){
    cls="fail"; icon="ti-file-x"; title="Generation failed"; msg="Contact Leo"; body=btn(!online || !!pendingCmd || s.checking);
  }
  g.className = "gen " + cls;
  g.innerHTML = `<div class="big"><i class="ti ${icon}"></i></div><h2>${title}</h2><p class="msg">${esc(msg)}</p>${body}`;
}

// ---------- render ----------
function render(){
  const s = status, monthly = s.mode === "monthly", online = agentOnline();
  if(!online) s.checking = false;
  $("segW").classList.toggle("on", !monthly); $("segM").classList.toggle("on", monthly);
  $("monthPick").style.display = monthly ? "" : "none";
  if(monthly && s.month && document.activeElement !== $("monthPick")) $("monthPick").value = s.month;
  $("recheck").disabled = s.checking || !online;
  const boxes = sources();
  // keep a file input that is being used (re-render would drop the chosen file)
  $("srcs").innerHTML = boxes.map(b => `<div class="src ${b.st}" data-k="${b.key}">
      <div class="row"><div class="ic"><i class="ti ${b.st==="fail"?"ti-alert-triangle":b.icon}"></i></div>
        <span class="nm">${esc(b.name)}</span><span class="pill"><i class="ti ${PILL_ICON[b.st]||""}" style="font-size:14px"></i>${esc(b.pill)}</span></div>
      ${b.issue ? `<div class="iss">${esc(b.issue)}</div>` : ""}${actionsHtml(b)}</div>`).join("");
  renderGen();
  renderDetails();
  requestAnimationFrame(drawLines);
}
function drawLines(){
  const svg = $("lines"); if(getComputedStyle(svg).display === "none") return;
  const w = $("flow").getBoundingClientRect(), gen = $("gen").getBoundingClientRect();
  const gx = gen.left - w.left, gy = gen.top - w.top + gen.height/2, bus = gx - 34;
  const COL = {ok:"#10b981", fail:"#e11d48", warn:"#d97706", wait:"#6366f1", idle:"#cbd5e1"};
  let p = "", anyFail = false, allOk = true;
  document.querySelectorAll(".src").forEach(e => {
    const st = ["ok","fail","warn","wait","idle"].find(c => e.classList.contains(c)) || "idle";
    anyFail = anyFail || st === "fail"; allOk = allOk && st === "ok";
    const r = e.getBoundingClientRect(), y = r.top - w.top + Math.min(r.height/2, 38), x = r.right - w.left;
    const bend = Math.abs(gy - y) < 12 ? 0 : (gy > y ? 12 : -12);
    p += `<path d="M${x} ${y} H${bus-12} ${bend?`Q${bus} ${y} ${bus} ${y+bend}`:`H${bus}`} V${gy}" fill="none" stroke="${COL[st]}" stroke-width="2.5" stroke-linecap="round"/>`;
  });
  const main = anyFail ? COL.fail : allOk ? COL.ok : COL.idle;
  p += `<path d="M${bus} ${gy} H${gx-5}" stroke="${main}" stroke-width="3" fill="none"/>
        <path d="M${gx-13} ${gy-7} L${gx-3} ${gy} L${gx-13} ${gy+7}" stroke="${main}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  svg.innerHTML = p;
}
function renderDetails(){
  const res = status.results;
  $("rows").innerHTML = res.map(r => `<tr><td class="n">${esc(r.title)}</td><td class="s-${r.status}">${esc(r.summary)}</td></tr>`).join("")
                        || `<tr><td>No results yet</td></tr>`;
  const j = run || {};
  $("console").style.display = runIsCurrent(j) || j.running ? "" : "none";
  $("console").textContent = (j.lines || []).join("\n");
}

// ---------- the new PDF downloads by itself ----------
function lastDownloaded(v){
  try{ if(v !== undefined) localStorage.setItem("weeklyPdfDownloadedAt", v); return localStorage.getItem("weeklyPdfDownloadedAt"); }
  catch(e){ return v === undefined ? window._pdfAt || null : (window._pdfAt = v); }
}
function autoDownload(){
  if(!pdfFresh()) return;
  const at = pdfMeta.at;
  if(lastDownloaded() === at) return;
  const recent = Date.now() - new Date(at).getTime() < 3 * 3600e3;
  lastDownloaded(at);
  if(recent || justGenerated){ justGenerated = false; downloadPdf(); }
}
async function downloadPdf(){
  if(!pdfFresh()){ toast("No report generated this week yet"); return; }
  toast("Downloading…");
  try{
    const f = await fbGet("files/pdf");
    if(!f || !f.b64){ toast("No PDF available yet"); return; }
    const bytes = Uint8Array.from(atob(f.b64), c => c.charCodeAt(0));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
    a.download = f.name || "report.pdf"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  }catch(e){ toast("Download failed: " + e.message); }
}

// ---------- refresh loop ----------
async function refresh(){
  clearTimeout(refreshTimer);
  try{
    const [a, s, r, ack, meta] = await Promise.all([fbGet("agent"), fbGet("status"), fbGet("run"), fbGet("command_ack"), fbGet("files/pdf_meta")]);
    agent = a; status = norm(s); run = r; pdfMeta = meta;
    if(pendingCmd && ack && ack.id === pendingCmd.id){ toast(ack.message || (ack.ok ? "Done" : "Not run")); pendingCmd = null; }
    if(pendingCmd && Date.now() - pendingCmd.at > 40000){ toast("The report PC didn't respond — is it on?"); pendingCmd = null; }
    const busyUi = document.activeElement && /SELECT|INPUT/.test(document.activeElement.tagName) && document.activeElement.closest(".src");
    if(!busyUi) render(); else renderGen();
    autoDownload();
    if(!autoChecked && agentOnline() && !status.checking && !(run && run.running) && !pendingCmd){
      autoChecked = true; sendCmd({type:"check"});
    }
  }catch(e){ toast(/401|403/.test(e.message) ? "No permission to read data" : "Cannot reach Firebase: " + e.message); }
  const waitingPdf = run && !run.running && run.returncode === 0 && runIsCurrent(run) && !pdfFresh()
                     && Date.now() - new Date(run.finished || 0).getTime() < 15 * 60e3;
  const active = (status && status.checking) || (run && run.running) || pendingCmd || waitingPdf;
  refreshTimer = setTimeout(refresh, active ? 2500 : 15000);
}
window.addEventListener("resize", () => requestAnimationFrame(drawLines));
refresh();
</script>
